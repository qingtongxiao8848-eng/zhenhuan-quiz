        // Quiz content and language settings
        let currentLang = 'zh';

        const uiText = {
            zh: {
                welcomeTitle: '',
                welcomeDesc: '后宫如深海，有人步步为营走向权力之巅，有人真情至性宁折不弯。若你踏入紫禁城，你会如何书写自己的命运？',
                welcomeQuote: '“紫禁城的风水养人，必不会叫你玉减香消。”',
                startBtn: '开启宫廷测试', qLabel: '问题', prevBtn: '← 上一题', homeBtn: '返回首页', hintText: '凭直觉作答即可',
                resultBadge: '测试结果', quoteLabel: '人物心声：', traitsLabel: '你的命运底色',

                footerText: '紫禁风云性格测试 · 走完属于你的宫廷命运',

            en: {
                welcomeTitle: '',
                welcomeDesc: 'The inner palace is a sea of hidden currents. If you entered the Forbidden City, how would you write your own destiny?',
                welcomeQuote: '“The Forbidden City nurtures those within it; it would never let your beauty fade.”',
                startBtn: 'Begin the Palace Test', qLabel: 'Question', prevBtn: '← Previous', homeBtn: 'Back to Home', hintText: 'Choose what feels most natural to you',
                resultBadge: 'Your Result', quoteLabel: 'Character Voice:', traitsLabel: 'Your Destiny at Heart',
                restartBtn: 'Take the Test Again', shareBtn: 'Copy Result', toastMsg: 'Result copied — share it with your friends!',
                footerText: 'Palace Fate Personality Test · Walk Your Own Palace Destiny',
                shareTemplate: (name, title) => `I just completed the Empresses in the Palace fate test!\nMy result: ${name} ${title}\nWho would you become?`
            }
        };

        const questions = [
            { id: 1, title: { zh: '你第一次走进宫门。四周陌生而庄严，新秀女们已经开始悄悄打量彼此。此时，你会——', en: 'You step through the palace gates for the first time. What do you do?' }, options: [
                { text: { zh: '不急着说话，先默默观察每个人的神情和举动。', en: 'Stay quiet and observe everyone before making a move.' }, scores: { zhenhuan: 2, empress: 1 } },
                { text: { zh: '大大方方地与人交谈。我相信，气势不能输。', en: 'Speak confidently. I refuse to lose in presence or spirit.' }, scores: { huafei: 2 } },
                { text: { zh: '找一个看起来真诚的人主动搭话。独自在这里，总归不容易。', en: 'Approach someone who seems sincere. It is hard to face this place alone.' }, scores: { guojunwang: 1, zhenhuan: 1, anlingrong: 1 } },
                { text: { zh: '不管别人怎么看，我只想按照自己的方式来。', en: 'No matter what others think, I will do things my own way.' }, scores: { yelanyi: 2, meizhuang: 1 } }
            ]},
            { id: 2, title: { zh: '一位秀女对你十分热情，但你发现她也在暗中向别人打听你的家世。你会——', en: 'A friendly newcomer is also asking others about your background. What do you do?' }, options: [
                { text: { zh: '表面如常，但心里记下这件事，以后再慢慢观察。', en: 'Act normally, remember it, and continue observing.' }, scores: { zhenhuan: 2, empress: 1 } },
                { text: { zh: '既然觉得她不真诚，就不必浪费时间维持关系。', en: 'If she is insincere, there is no need to maintain the relationship.' }, scores: { meizhuang: 2, yelanyi: 1 } },
                { text: { zh: '也许她只是没有安全感，我愿意先相信她一次。', en: 'Perhaps she simply feels insecure. I am willing to trust her once.' }, scores: { guojunwang: 2, anlingrong: 1 } },
                { text: { zh: '既然大家都在试探，那我也不会毫无准备。', en: 'If everyone is testing one another, I will be prepared too.' }, scores: { empress: 2, huafei: 1 } }
            ]},
            { id: 3, title: { zh: '一次宴会上，你的一句话让皇帝注意到了你。突然之间，你成了众人议论的对象。面对这份恩宠，你会——', en: 'The Emperor notices you, and suddenly everyone is talking. How do you respond?' }, options: [
                { text: { zh: '越是被人关注，越要谨慎。先保护好自己。', en: 'The more attention I receive, the more careful I should be.' }, scores: { zhenhuan: 2, meizhuang: 1 } },
                { text: { zh: '既然机会来了，我自然不会让给别人。', en: 'If an opportunity comes, I will not hand it to someone else.' }, scores: { huafei: 2, empress: 1 } },
                { text: { zh: '这份关注让我有些不安。我更在意别人是否因此讨厌我。', en: 'The attention makes me uneasy. I worry whether others now dislike me.' }, scores: { anlingrong: 2 } },
                { text: { zh: '恩宠也好，冷落也罢，我不想因此改变自己。', en: 'Favor or neglect, I do not want either to change who I am.' }, scores: { yelanyi: 2, guojunwang: 1 } }
            ]},
            { id: 4, title: { zh: '你最信任的人突然被指控犯错。所有证据似乎都指向她，她只对说什么了一句：“你信我吗？”你会——', en: 'Your closest friend is accused and asks only: “Do you believe me?”' }, options: [
                { text: { zh: '先调查真相。信任不代表盲目，但我不会轻易放弃朋友。', en: 'Seek the truth first. Trust is not blindness, but I will not abandon a friend easily.' }, scores: { zhenhuan: 2 } },
                { text: { zh: '如果我相信她，就会站在她身边。其他人的看法不重要。', en: 'If I believe her, I will stand beside her. Others’ opinions do not matter.' }, scores: { meizhuang: 2, guojunwang: 1 } },
                { text: { zh: '我会怀疑：她是不是有什么事情没有告诉我？', en: 'I would wonder whether she is hiding something from me.' }, scores: { empress: 2, anlingrong: 1 } },
                { text: { zh: '谁敢冤枉我的人，我不会让这件事轻易过去。', en: 'No one gets to frame my people without consequences.' }, scores: { huafei: 2, yelanyi: 1 } }
            ]},
            { id: 5, title: { zh: '你终于发现，有人一直在暗中针对你。她地位更高，也拥有更多支持者。你会怎么做？', en: 'Someone powerful has been working against you. What is your move?' }, options: [
                { text: { zh: '不正面冲突。我要等一个真正能够改变局势的机会。', en: 'Avoid direct conflict and wait for the moment that can truly change the situation.' }, scores: { zhenhuan: 2, empress: 1 } },
                { text: { zh: '她既然已经欺到头上，我绝不会忍。', en: 'If she has pushed this far, I will not tolerate it.' }, scores: { huafei: 2, yelanyi: 1 } },
                { text: { zh: '我不喜欢争斗，但如果触及底线，我会彻底与她划清界限。', en: 'I dislike conflict, but once my principles are crossed, I will sever ties completely.' }, scores: { meizhuang: 2 } },
                { text: { zh: '我要让自己变得更强，总有一天不再需要害怕任何人。', en: 'I will become stronger until I no longer need to fear anyone.' }, scores: { anlingrong: 2, zhenhuan: 1 } }
            ]},
            { id: 6, title: { zh: '深夜，你独自站在宫墙下，忽然意识到：为了活下去，你可能会慢慢变成另一个人。你最害怕失去的是——', en: 'To survive, you may become someone else. What do you fear losing most?' }, options: [
                { text: { zh: '曾经那个相信真心的自己。', en: 'The part of myself that once believed in sincerity.' }, scores: { zhenhuan: 2, guojunwang: 2 } },
                { text: { zh: '自己的尊严。即使没有人理解，我也不愿低头。', en: 'My dignity. Even if no one understands me, I refuse to bow.' }, scores: { meizhuang: 2, yelanyi: 1 } },
                { text: { zh: '被所有人抛在身后，再也没有人需要我。', en: 'Being left behind by everyone, with no one needing me anymore.' }, scores: { anlingrong: 2 } },
                { text: { zh: '失去掌控自己命运的能力。', en: 'Losing the ability to control my own destiny.' }, scores: { empress: 2, huafei: 1 } }
            ]},
            { id: 7, title: { zh: '多年以后，你终于拥有了曾经想要的东西，却也失去了一些重要的人和事。如果可以重新选择，你会——', en: 'Years later, you have what you wanted, but have lost much. Would you choose differently?' }, options: [
                { text: { zh: '仍然选择走到今天。至少现在，我能掌握自己的命运。', en: 'I would still choose this path. At least now, I control my own destiny.' }, scores: { zhenhuan: 2, empress: 1 } },
                { text: { zh: '宁愿少一些权力，也想保留最初的真心。', en: 'I would rather have less power and keep my original sincerity.' }, scores: { guojunwang: 2, meizhuang: 1 } },
                { text: { zh: '如果这是我认定的路，就算孤身一人也不会后悔。', en: 'If this is the path I chose, I would not regret it even alone.' }, scores: { yelanyi: 2, huafei: 1 } },
                { text: { zh: '我只希望，当初能有一个人真正看见我的努力。', en: 'I only wish someone had truly seen how hard I tried.' }, scores: { anlingrong: 2 } }
            ]},
            { id: 8, title: { zh: '宫门缓缓关闭。多年后，当有人问起你的一生，你希望别人如何记住你？', en: 'Years later, how would you want your life to be remembered?' }, options: [
                { text: { zh: '“她曾经天真，但最后成为了自己命运的主人。”', en: '“She was once innocent, but became the master of her own fate.”' }, scores: { zhenhuan: 3 } },
                { text: { zh: '“她这一生爱得热烈，恨得痛快，从不让任何人轻视。”', en: '“She loved fiercely, hated freely, and never let anyone look down on her.”' }, scores: { huafei: 3 } },
                { text: { zh: '“她机关算尽，只为守住自己认定的东西。”', en: '“She calculated every move to protect what she believed was hers.”' }, scores: { empress: 3 } },
                { text: { zh: '“她不一定赢得最多，但从未违背自己的原则。”', en: '“She may not have won the most, but she never betrayed her principles.”' }, scores: { meizhuang: 3 } },
                { text: { zh: '“她一直渴望被看见，也一直拼命证明自己的价值。”', en: '“She longed to be seen and fought to prove her worth.”' }, scores: { anlingrong: 3 } },
                { text: { zh: '“她从不属于任何人的规矩，只忠于自己的选择。”', en: '“She belonged to no one’s rules, only to her own choices.”' }, scores: { yelanyi: 3 } },
                { text: { zh: '“比起权力和名利，她始终记得什么是真心。”', en: '“More than power or fame, she remembered what a sincere heart meant.”' }, scores: { guojunwang: 3 } }
            ]}
        ];

        // Switch Language Dynamic UI Update
        function setLanguage(lang) {
            currentLang = lang;
            
            // Buttons visual update
            const btnZh = document.getElementById('btn-lang-zh');
            const btnEn = document.getElementById('btn-lang-en');
            
            if (lang === 'zh') {
                btnZh.className = "px-3 py-1 rounded text-xs border border-palace-gold bg-palace-gold text-palace-wood font-bold transition";
                btnEn.className = "px-3 py-1 rounded text-xs border border-palace-gold/50 text-palace-lightgold hover:border-palace-gold transition";
            } else {
                btnEn.className = "px-3 py-1 rounded text-xs border border-palace-gold bg-palace-gold text-palace-wood font-bold transition";
                btnZh.className = "px-3 py-1 rounded text-xs border border-palace-gold/50 text-palace-lightgold hover:border-palace-gold transition";
            }

            // Update Static Strings
            const t = uiText[lang];
            const welcomeTitle = document.getElementById('welcome-title'); if (welcomeTitle) welcomeTitle.innerText = t.welcomeTitle;
            document.getElementById('welcome-desc').innerText = t.welcomeDesc;
            document.getElementById('welcome-quote').innerText = t.welcomeQuote;
            document.getElementById('start-btn').innerText = t.startBtn;
            document.getElementById('q-label').innerText = t.qLabel;
            document.getElementById('prev-btn').innerText = t.prevBtn;
            const homeBtnText = document.getElementById('home-btn-text'); if (homeBtnText) homeBtnText.innerText = t.homeBtn;
            const resultHomeBtn = document.getElementById('result-home-btn'); if (resultHomeBtn) resultHomeBtn.innerText = t.homeBtn;
            document.getElementById('hint-text').innerText = t.hintText;
            const resultBadge = document.getElementById('result-badge'); if (resultBadge) resultBadge.innerText = t.resultBadge;
            document.getElementById('quote-label').innerText = t.quoteLabel;
            document.getElementById('traits-label').innerHTML = `<span class="inline-block w-2 h-2 bg-palace-gold rounded-full mr-2"></span>${t.traitsLabel}`;
            document.getElementById('restart-btn').innerText = t.restartBtn;
            document.getElementById('share-btn').innerHTML = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> ${t.shareBtn}`;
            document.getElementById('toast-msg').innerText = t.toastMsg;
            document.getElementById('footer-text').innerText = t.footerText;

            // Re-render current question if quiz active
            if (!quizScreen.classList.contains('hidden')) {
                renderQuestion();
            }
        }

        // State Management
        let currentQuestion = 0;
        let userAnswers = [];
        let scores = {
            zhenhuan: 0,
            huafei: 0,
            empress: 0,
            meizhuang: 0,
            anlingrong: 0,
            yelanyi: 0,
            guojunwang: 0
        };

        // DOM Elements
        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        function startQuiz() {
            welcomeScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQuestion = 0;
            resetScores();
            renderQuestion();
        }

        function resetScores() {
            userAnswers = [];
            for (let k in scores) scores[k] = 0;
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-question-num').innerText = currentQuestion + 1;
            document.getElementById('total-questions-num').innerText = questions.length;
            document.getElementById('question-text').innerText = `${q.id}. ${q.title[currentLang]}`;

            // Update Progress Bar
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Previous Button status
            document.getElementById('prev-btn').disabled = currentQuestion === 0;

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const isSelected = userAnswers[currentQuestion] === idx;
                const optEl = document.createElement('div');
                optEl.className = `option-card p-4 rounded-md cursor-pointer flex items-center justify-between text-sm sm:text-base ${isSelected ? 'selected' : ''}`;
                optEl.onclick = () => selectOption(idx);

                optEl.innerHTML = `
                    <span class="text-palace-ink leading-snug">${opt.text[currentLang]}</span>
                    <div class="w-5 h-5 rounded-full border border-palace-gold/60 flex items-center justify-center shrink-0 ml-3 ${isSelected ? 'bg-palace-gold' : ''}">
                        ${isSelected ? '<div class="w-2 h-2 rounded-full bg-palace-darkred"></div>' : ''}
                    </div>
                `;
                optionsContainer.appendChild(optEl);
            });
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            renderQuestion();

            // Auto advance after slight delay for visual feedback
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                } else {
                    calculateResult();
                }
            }, 250);
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function calculateResult() {
            // Reset scores map
            for (let k in scores) scores[k] = 0;
            
            // Tally Scores correctly from selected answers
            userAnswers.forEach((ansIdx, qIdx) => {
                if (ansIdx !== undefined && questions[qIdx]) {
                    const option = questions[qIdx].options[ansIdx];
                    if (option && option.scores) {
                        for (let charKey in option.scores) {
                            if (scores[charKey] !== undefined) {
                                scores[charKey] += option.scores[charKey];
                            }
                        }
                    }
                }
            });

            // Find character with max score
            let maxChar = 'zhenhuan';
            let maxScore = -1;
            for (let charKey in scores) {
                if (scores[charKey] > maxScore) {
                    maxScore = scores[charKey];
                    maxChar = charKey;
                }
            }

            showResult(maxChar);
        }

        function showResult(charKey) {
            const charData = characters[charKey] || characters['zhenhuan'];

            // Update Avatar
            const avatarImg = document.getElementById('char-avatar');
            if (avatarImg) {
                avatarImg.src = charData.avatar;
            }

            document.getElementById('char-name').innerText = charData.name[currentLang];
            document.getElementById('char-title').innerText = charData.title[currentLang];
            document.getElementById('char-quote').innerText = charData.quote[currentLang];
            document.getElementById('char-traits').innerText = charData.traits[currentLang];

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            currentQuestion = 0;
            resetScores();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() {
            resultScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyShareText() {
            const name = document.getElementById('char-name').innerText;
            const title = document.getElementById('char-title').innerText;
            const text = uiText[currentLang].shareTemplate(name, title);

            // Fallback for clipboard copy
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast-msg');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
